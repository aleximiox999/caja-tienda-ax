<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lector Tienda AX</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f2f4f7;font:16px Arial;color:#222}main{max-width:520px;margin:auto;background:#fff;padding:16px;border-radius:14px}h1{font-size:24px;color:#146c43;text-align:center}button{display:block;width:100%;padding:15px;margin:10px 0;border:0;border-radius:9px;font-size:17px;font-weight:bold;color:white;background:#16834a}button:disabled{opacity:.5}.gray{background:#555}.red{background:#ba302b}#reader{width:100%;overflow:hidden}#estado{padding:10px;background:#edf4ee;border-radius:8px;overflow-wrap:anywhere}#lista{padding-left:24px}li{padding:7px 0}.item{display:flex;align-items:center;gap:8px;justify-content:space-between}.qty{display:flex;gap:6px;align-items:center}.qty button{width:auto;margin:0;padding:9px 13px;font-size:18px}.qty span{min-width:22px;text-align:center}small{color:#555}</style></head>
<body><main><h1>CAJA TIENDA AX</h1><p id="instruccion">Escaneá los productos uno detrás de otro.</p>
<button id="iniciar" onclick="iniciarEscaner()">INICIAR CÁMARA</button><div id="reader"></div><div id="controlesCamara" hidden style="padding:10px;border:1px solid #b4d2c0;border-radius:9px;margin:10px 0"><strong>LUZ DE CÁMARA</strong><button id="linterna" class="gray" onclick="alternarLuz()">ENCENDER LINTERNA</button><small id="avisoCamara"></small></div>
<button class="red" id="detener" onclick="detenerEscaner()" disabled>DETENER CÁMARA</button>
<div style="border:1px solid #d3dde4;border-radius:9px;padding:10px;margin:10px 0"><label for="manualCodigo">Si no detecta las barras, escribe los números impresos:</label><input id="manualCodigo" inputmode="numeric" pattern="[0-9]*" autocomplete="off" style="width:100%;padding:12px;font-size:18px"><button onclick="codigoEscrito()">AGREGAR CÓDIGO ESCRITO</button></div><p id="estado" role="status">Listo.</p><div id="revisarLectura" hidden style="border:2px solid #c58b16;border-radius:10px;padding:12px;margin:12px 0;background:#fff9e8"><strong>VERIFICA LOS NÚMEROS DEL ENVASE</strong><p id="codigoRevisar" style="font-size:23px;letter-spacing:1px;overflow-wrap:anywhere"></p><button id="confirmarCodigo" onclick="aceptarCodigo()">SÍ, COINCIDE · ACEPTAR</button><button class="red" onclick="rechazarCodigo()">NO COINCIDE · REPETIR</button></div><h2 id="contador">0 productos escaneados</h2><ol id="lista"></ol>
<small>El mismo código se registra una sola vez mientras escaneás. Para sumar otra unidad, usá el botón +1 junto al producto. Revisá la lista antes de regresar.</small>
<button id="volver" onclick="volverACaja()">VOLVER A CAJA CON LOS PRODUCTOS</button>
<button class="gray" onclick="quitarUltimo()">QUITAR ÚLTIMA LECTURA</button>
</main><script>
const APP='https://script.google.com/macros/s/AKfycby5EBg6M7Mr-H-G00WKDJASVEckdg9FzWl-UKAiiTcqjq2lj_HDzRXmkxN0ldDlW2ohPA/exec';
const modo=new URLSearchParams(location.search).get('modo')||'carrito';
let escaner=null,activo=false,iniciando=false,codigos=[],ultimo='';
let capacidadCamara=null,luzEncendida=false;
async function configurarCamara(){let cap={};try{cap=escaner.getRunningTrackCapabilities()||{}}catch(e){}capacidadCamara=cap;$('controlesCamara').hidden=false;$('linterna').disabled=!cap.torch;$('avisoCamara').textContent=cap.torch?'Usa la linterna solo cuando falte luz.':'Linterna no compatible en este navegador.';if(Array.isArray(cap.focusMode)&&cap.focusMode.includes('continuous')){try{await escaner.applyVideoConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}}}
async function alternarLuz(){if(!escaner||!capacidadCamara?.torch)return;try{await escaner.applyVideoConstraints({advanced:[{torch:!luzEncendida}]});luzEncendida=!luzEncendida;$('linterna').textContent=luzEncendida?'APAGAR LINTERNA':'ENCENDER LINTERNA'}catch(e){mensaje('La linterna no está disponible.')}}

let lecturaPendiente='',repeticiones=0,ultimaLectura=0,codigoEnRevision='';
const $=id=>document.getElementById(id);
function mensaje(t){$('estado').textContent=t;}
function codigoValido(s){if(!/^\d+$/.test(s))return false;if(![8,12,13,14].includes(s.length))return s.length>=6&&s.length<=32;let suma=0;for(let i=s.length-2,peso=3;i>=0;i--,peso=peso===3?1:3)suma+=Number(s[i])*peso;return (10-suma%10)%10===Number(s.at(-1))}
function confirmarLectura(s,callback){if(!s||s.length>80)return false;lecturaPendiente='';repeticiones=0;callback(s);mensaje(codigoValido(s)?'Lectura detectada. COMPARA TODOS LOS DÍGITOS con la etiqueta antes de aceptar.':'Lectura detectada con formato no verificado. Si no coincide con la etiqueta, pulsa REPETIR.');return true}
function prepararConfirmacion(c){codigoEnRevision=c;$('codigoRevisar').textContent=c;$('confirmarCodigo').disabled=false;$('revisarLectura').hidden=false;mensaje('Compara estos números con los impresos en el envase. Acepta solo si son iguales.')}
function aceptarCodigo(){const c=codigoEnRevision;if(!c)return;codigoEnRevision='';$('revisarLectura').hidden=true;if(c===ultimo)return;ultimo=c;if(modo!=='carrito'){codigos=[c];render();volverACaja();return}if(codigos.length>=40){mensaje('Límite de 40 unidades.');return}codigos.push(c);render();if(navigator.vibrate)navigator.vibrate(120);mensaje('Código confirmado: '+c+'. Apunta al siguiente producto.')}
function rechazarCodigo(){codigoEnRevision='';lecturaPendiente='';repeticiones=0;ultimaLectura=0;$('revisarLectura').hidden=true;mensaje('Código descartado. Ajusta distancia, luz y enfoque; vuelve a apuntar al código.')}
function render(){
 const cuenta=codigos.length;
 $('contador').textContent=cuenta+' producto'+(cuenta===1?'':'s')+' escaneado'+(cuenta===1?'':'s');
 $('lista').replaceChildren();
 const sum=new Map();codigos.forEach(c=>sum.set(c,(sum.get(c)||0)+1));
 for(const [c,n] of sum){
  const li=document.createElement('li');li.className='item';
  const nombre=document.createElement('span');nombre.textContent=c;
  const controles=document.createElement('div');controles.className='qty';
  const menos=document.createElement('button');menos.className='gray';menos.textContent='−1';menos.setAttribute('aria-label','Quitar una unidad de '+c);menos.onclick=()=>cambiarCantidad(c,-1);
  const cantidad=document.createElement('span');cantidad.textContent=n;
  const mas=document.createElement('button');mas.textContent='+1';mas.setAttribute('aria-label','Agregar una unidad de '+c);mas.onclick=()=>cambiarCantidad(c,1);
  controles.append(menos,cantidad,mas);li.append(nombre,controles);$('lista').appendChild(li);
 }
 $('volver').disabled=modo==='carrito'&&!cuenta;
}
function cambiarCantidad(c,delta){
 if(modo!=='carrito')return;
 if(delta>0){if(codigos.length>=40){mensaje('Límite de 40 unidades.');return;}codigos.push(c);}
 else {const i=codigos.lastIndexOf(c);if(i>=0)codigos.splice(i,1);}
 render();mensaje('Cantidad actualizada para '+c+'.');
}
async function iniciarEscaner(){if(activo||iniciando)return;if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){mensaje('Se requiere HTTPS y permiso de cámara.');return;}if(typeof Html5Qrcode==='undefined'){mensaje('No se cargó la biblioteca del lector.');return;}
 iniciando=true;$('iniciar').disabled=true;mensaje('Abriendo cámara...');try{escaner=new Html5Qrcode('reader',{useBarCodeDetectorIfSupported:true,formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF]});await escaner.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.min(400,Math.floor(w*.94)),height:Math.min(220,Math.floor(h*.75))})},codigoDetectado,()=>{});activo=true;$('detener').disabled=false;try{await configurarCamara()}catch(e){console.warn('Ajustes de cámara no compatibles',e)}mensaje('Cámara activa. Esperando código. Si aparece un número, compáralo antes de aceptar.');}catch(e){console.error(e);escaner=null;$('iniciar').disabled=false;mensaje('No se pudo abrir la cámara. Revisá los permisos.');}finally{iniciando=false;}}
function codigoEscrito(){const c=$('manualCodigo').value.trim();if(!/^\\d{6,32}$/.test(c)){mensaje('Escribe entre 6 y 32 dígitos del envase.');return}codigoEnRevision='';prepararConfirmacion(c)}
function codigoDetectado(texto){if(!activo||!texto||codigoEnRevision)return;const c=String(texto).trim();if(c===ultimo)return;confirmarLectura(c,prepararConfirmacion)}
async function detenerEscaner(){if(iniciando)return;$('detener').disabled=true;activo=false;ultimo='';lecturaPendiente='';repeticiones=0;codigoEnRevision='';$('revisarLectura').hidden=true;if(escaner){try{await escaner.stop();}catch(e){}try{escaner.clear();}catch(e){}}escaner=null;capacidadCamara=null;luzEncendida=false;$('controlesCamara').hidden=true;$('iniciar').disabled=false;mensaje('Cámara detenida.');}
function quitarUltimo(){if(codigos.length){codigos.pop();render();mensaje('Última lectura quitada.');}}
function volverACaja(){if(modo==='carrito'&&!codigos.length){mensaje('Primero escaneá un producto.');return;}const url=new URL(APP);url.searchParams.set('modo',modo);url.searchParams.set('loteId',String(Date.now())+'-'+Math.random().toString(36).slice(2));if(modo==='carrito')url.searchParams.set('lote',JSON.stringify(codigos));else if(codigos.length)url.searchParams.set('codigo',codigos[0]);location.assign(url.toString());}
if(modo!=='carrito'){$('instruccion').textContent='Escaneá un código para regresar a la caja.';$('volver').textContent='VOLVER A CAJA';}render();
</script></body></html>
