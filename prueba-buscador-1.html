<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba buscador TIENDA AMPHX</title><style>body{font:16px system-ui;background:#f4f7fa;color:#183047;max-width:650px;margin:30px auto;padding:16px}main{background:white;border:1px solid #ddd;border-radius:14px;padding:20px}input,button{font:inherit;padding:12px;border-radius:8px}input{width:100%;box-sizing:border-box;border:1px solid #aaa}button{width:100%;text-align:left;border:1px solid #b5d7cb;background:#edf8f3;margin-top:6px;cursor:pointer}.meta{font-size:13px;color:#52677b}#estado{margin:14px 0}#lista{margin-top:8px}</style><main><h2>TIENDA AMPHX · Prueba <span id="version"></span></h2><p>Prueba de búsqueda independiente. No registra ni modifica productos.</p><input id="buscar" placeholder="Escribe AR" autocomplete="off"><div id="estado">Preparando…</div><div id="lista"></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://tdentkkksydawctcezrs.supabase.co','sb_publishable_WJJH9gIvf7vb-fMrVtz5Cw_MzHGK4wh');const $=x=>document.getElementById(x);let items=[];const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();async function init(){const{data:{user}}=await db.auth.getUser();if(!user){$('estado').textContent='Inicia sesión primero en COSTOS, en este mismo navegador.';return}const{data,error}=await db.from('productos').select('id,detalles,precio_venta,codigo_barras').order('detalles');if(error){$('estado').textContent='Error de acceso: '+error.message;return}items=data||[];$('estado').textContent='Cargados '+items.length+' productos. Escribe AR.';render()}function button(p){let b=document.createElement('button');b.type='button';b.textContent=norm(p.detalles)+' · Bs '+Number(p.precio_venta).toFixed(2);b.onclick=()=>{$('buscar').value=norm(p.detalles);render()};return b}function matches(){const q=norm($('buscar').value.trim());return q.length<2?[]:items.filter(p=>norm(p.detalles).includes(q)||norm(p.codigo_barras).includes(q))} $('version').textContent='1 · lista visible';function render(){let a=matches();$('lista').replaceChildren();$('estado').textContent=$('buscar').value.length<2?'Escribe al menos dos letras':a.length+' coincidencia(s)';for(let p of a)$('lista').append(button(p))}$('buscar').addEventListener('input',render);init();</script>
