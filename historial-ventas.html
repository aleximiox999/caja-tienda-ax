<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historial de ventas · Tienda AMPHX</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#080a0e,#172435 52%,#090c12);color:white;font-size:15px;line-height:1.5}
main{max-width:1250px;margin:auto;padding:20px 12px 45px}h1{font-size:24px;letter-spacing:1px;text-shadow:0 0 15px #078cdd88;margin:0}h2{font-size:19px}
p{color:#d7e5f3}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:40px}
button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{background:#0d1a28;color:white;border:1px solid #468ecc;border-radius:9px;padding:11px;width:100%;min-height:44px;color-scheme:dark}
input::placeholder,textarea::placeholder{color:#a8bed0}label{display:block;font-weight:650;font-size:13px;color:#e8f5ff;margin:0 0 5px}
.btn{background:linear-gradient(160deg,#136bb3,#07375c);border:1px solid #56b0fa;border-radius:9px;color:white;font-weight:700;padding:9px 13px}
.btn.sec{background:linear-gradient(145deg,#273440,#0d1722);border-color:#709abd}.btn.danger{background:#4c1a25;border-color:#e08e97}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 10px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.metric,.sale,.editor{background:linear-gradient(140deg,#162638,#0c1521);border:1px solid #2e7ebc;border-radius:12px;box-shadow:0 8px 22px #0005,inset 0 1px 0 #dcf3ff1a}
.metric{padding:12px}.metric small{color:#c2d5e8;display:block}.metric b{font-size:20px}
.sale{padding:15px;margin:13px 0}.saleHead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.saleHead strong{font-size:17px}.sum{text-align:right;font-size:25px;font-weight:800}
.statusPill{border:1px solid #7daed6;color:#eaf5ff;display:inline-block;padding:3px 9px;border-radius:30px;font-size:12px}.void{border-color:#e58b92;color:#ffb4bc}
.tablewrap{overflow-x:auto;border-radius:9px;border:1px solid #335f83;margin:13px 0}table{border-collapse:collapse;width:100%;min-width:470px}th,td{padding:9px 11px;text-align:left;border-bottom:1px solid #2b455b}th{background:#193957;color:#eaf5ff;font-size:12px}tr:last-child td{border-bottom:0}
.empty{color:#dceafb;text-align:center;padding:26px;border:1px dashed #6b9bbd;border-radius:10px;margin-top:14px}
.editor{padding:17px;margin:17px 0;border-color:#69c2ff}.line{display:grid;grid-template-columns:minmax(140px,2fr) minmax(90px,.6fr) minmax(90px,.8fr) auto;gap:10px;align-items:end;margin:12px 0}.line .btn{margin-bottom:0}.field{margin:12px 0}.mixed{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}details{margin-top:14px;border-top:1px solid #405970;padding-top:8px}summary{color:#a8d6fb;cursor:pointer}
#msg{padding:7px 0;min-height:32px;color:#cfe6f8}#msg.error{color:#ffadb5}#msg.ok{color:#a4f4cb}
@media(max-width:800px){.filters{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){main{padding:14px 8px}.filters{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}.line .product{grid-column:span 2}.sum{text-align:left}}
</style></head><body><main>
<h1>HISTORIAL DE VENTAS</h1><p>Ventas de Tienda AMPHX con productos, cantidades, precios unitarios, forma de pago y total. Solo el administrador puede corregir o anular.</p>
<div id="msg" role="status">Comprobando acceso…</div>
<section id="view" class="hidden">
<div class="filters">
<div id="empleadoCampo"><label for="empleado">Empleado</label><select id="empleado"><option value="">TODOS</option></select></div>
<div><label for="desde">Desde</label><input type="date" id="desde"></div>
<div><label for="hasta">Hasta</label><input type="date" id="hasta"></div>
<div><label for="busca">Producto o empleado</label><input type="search" id="busca" autocomplete="off" placeholder="Buscar…"></div>
</div>
<div class="actions"><button id="buscar" class="btn">BUSCAR VENTAS</button><button id="limpiar" class="btn sec">LIMPIAR FILTROS</button></div>
<div id="resumen" class="summary"></div>
<div id="editor" class="editor hidden"></div>
<div id="lista"></div>
<div class="actions" style="justify-content:center"><button class="btn sec hidden" id="mas">VER MÁS VENTAS</button></div>
</section>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://tdentkkksydawctcezrs.supabase.co','sb_publishable_WJJH9gIvf7vb-fMrVtz5Cw_MzHGK4wh');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dinero=n=>'Bs '+Number(n||0).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const cant=n=>Number(n||0).toLocaleString('es-BO',{maximumFractionDigits:3});
const fecha=s=>new Date(s).toLocaleString('es-BO',{timeZone:'America/La_Paz',dateStyle:'short',timeStyle:'short'});
const mensaje=(s,cl='')=>{$('msg').textContent=s;$('msg').className=cl;};
let perfil=null,personas=[],productos=[],ventas=[],resumen={},editando=null,borrador=[],cargando=false;
function mostrar(id,b){$(id).classList.toggle('hidden',!b);}
function altura(){try{parent.postMessage({tipo:'amp-historial-altura',alto:document.documentElement.scrollHeight},location.origin)}catch(e){}}
if('ResizeObserver' in window)new ResizeObserver(altura).observe(document.body);
async function iniciar(){
 try{
  const {data:{user},error:ee}=await db.auth.getUser();
  if(ee||!user){mensaje('Iniciá sesión desde la Caja de Tienda AMPHX para consultar el historial.','error');return;}
  const {data,error}=await db.from('empleados').select('id,nombre,rol,activo').eq('auth_user_id',user.id).maybeSingle();
  if(error||!data?.activo){mensaje('Tu cuenta no está autorizada para consultar ventas.','error');return;}
  perfil=data;mostrar('view',true);mostrar('empleadoCampo',data.rol==='administrador');
  if(data.rol==='administrador'){
   const r=await db.from('empleados').select('id,nombre').order('nombre');
   if(r.error)throw r.error;
   personas=r.data||[];
   $('empleado').innerHTML='<option value="">TODOS LOS EMPLEADOS</option>'+personas.map(e=>'<option value="'+esc(e.id)+'">'+esc(e.nombre)+'</option>').join('');
   const c=await db.rpc('listar_catalogo_venta');
   productos=Array.isArray(c.data)?c.data:[];
  }
  await cargar(true);
 }catch(e){mensaje('Error al abrir historial: '+(e.message||e),'error');}
}
async function cargar(reset){
 if(cargando||!perfil)return;
 cargando=true;$('mas').disabled=true;
 if(reset){ventas=[];resumen={};mostrar('editor',false);editando=null;$('lista').innerHTML='<div class="empty">Consultando ventas…</div>';}
 try{
  const filtros={p_desde:$('desde').value||null,p_hasta:$('hasta').value||null,p_empleado:perfil.rol==='administrador'?($('empleado').value||null):null,p_buscar:$('busca').value.trim()||null,p_limite:100,p_desplazamiento:ventas.length};
  if(filtros.p_desde&&filtros.p_hasta&&filtros.p_desde>filtros.p_hasta)throw Error('Revisá el rango de fechas.');
  const {data,error}=await db.rpc('listar_historial_ventas',filtros);
  if(error)throw error;
  resumen=data?.resumen||{};
  ventas.push(...(data?.ventas||[]));pintar();
  mensaje('Mostrando '+ventas.length+' de '+Number(resumen.registros||0)+' operaciones.','ok');
 }catch(e){mensaje('No se pudo consultar el historial: '+(e.message||e),'error');$('lista').innerHTML='<div class="empty">Error de consulta. Comprobá tu conexión.</div>';}
 finally{cargando=false;$('mas').disabled=false;altura();}
}
function pintar(){
 $('resumen').innerHTML=[['OPERACIONES',Number(resumen.registros||0)],['TOTAL VENDIDO',dinero(resumen.total)],['EFECTIVO',dinero(resumen.efectivo)],['QR',dinero(resumen.qr)]].map(x=>'<div class="metric"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('');
 mostrar('mas',ventas.length<Number(resumen.registros||0));
 if(!ventas.length){$('lista').innerHTML='<div class="empty">Todavía no hay ventas para esta búsqueda. Los cobros pendientes de sincronización aparecerán cuando se confirmen.</div>';return;}
 $('lista').innerHTML=ventas.map(v=>{
  const filas=(v.detalles||[]).map(d=>'<tr><td>'+esc(d.producto)+'</td><td>'+cant(d.cantidad)+'</td><td>'+dinero(d.precio_unitario)+'</td><td>'+dinero(d.subtotal)+'</td></tr>').join('');
  const acciones=perfil.rol==='administrador'&&v.estado==='registrada'?'<div class="actions"><button class="btn sec" data-editar="'+esc(v.id)+'">CORREGIR</button><button class="btn danger" data-anular="'+esc(v.id)+'">ANULAR</button></div>':'';
  const audit=(v.auditoria||[]).length?'<details><summary>Registro de cambios ('+v.auditoria.length+')</summary>'+v.auditoria.map(a=>'<p>• '+esc(a.accion.toUpperCase())+' · '+esc(fecha(a.fecha))+' · '+esc(a.responsable)+' · '+esc(a.motivo)+'</p>').join('')+'</details>':'';
  return '<article class="sale"><div class="saleHead"><div><strong>'+esc(v.empleado)+'</strong><p>'+esc(fecha(v.fecha))+' · '+esc(v.metodo_pago.toUpperCase())+'</p><span class="statusPill '+(v.estado==='anulada'?'void':'')+'">'+esc(v.estado.toUpperCase())+'</span></div><div><div style="font-size:12px;text-align:right;color:#bbd1e3">TOTAL DE VENTA</div><div class="sum">'+dinero(v.total)+'</div></div></div><div class="tablewrap"><table><thead><tr><th>PRODUCTO</th><th>CANTIDAD</th><th>PRECIO</th><th>SUBTOTAL</th></tr></thead><tbody>'+filas+'</tbody></table></div><p>EFECTIVO: '+dinero(v.monto_efectivo)+' · QR: '+dinero(v.monto_qr)+'</p>'+acciones+audit+'</article>';
 }).join('');
 document.querySelectorAll('[data-editar]').forEach(b=>b.onclick=()=>abrirEdicion(b.dataset.editar));
 document.querySelectorAll('[data-anular]').forEach(b=>b.onclick=()=>anular(b.dataset.anular));
 altura();
}
function opciones(d){
 const arr=productos.map(p=>'<option value="'+esc(p.id)+'" '+(Number(p.id)===Number(d.producto_id)?'selected':'')+'>'+esc(p.detalles)+'</option>').join('');
 return productos.some(p=>Number(p.id)===Number(d.producto_id))?arr:'<option selected value="'+esc(d.producto_id)+'">'+esc(d.producto+' (inactivo)')+'</option>'+arr;
}
function pintarLineas(){
 $('lineas').innerHTML=borrador.map((d,i)=>'<div class="line" data-i="'+i+'"><div class="product"><label>PRODUCTO</label><select data-campo="producto_id">'+opciones(d)+'</select></div><div><label>CANTIDAD</label><input type="number" min="0.001" step="any" data-campo="cantidad" value="'+esc(d.cantidad)+'"></div><div><label>PRECIO (Bs)</label><input type="number" min="0.01" step="0.01" data-campo="precio_unitario" value="'+esc(d.precio_unitario)+'"></div><button type="button" class="btn danger" data-quitar="'+i+'">✕</button></div>').join('');
 document.querySelectorAll('.line').forEach(line=>{
  const i=Number(line.dataset.i);
  line.querySelectorAll('[data-campo]').forEach(input=>input.oninput=()=>{
   const k=input.dataset.campo;borrador[i][k]=Number(input.value);
   if(k==='producto_id'){
    const p=productos.find(p=>Number(p.id)===Number(input.value));
    if(p){borrador[i].producto=p.detalles;borrador[i].precio_unitario=Number(p.precio_venta);}
    pintarLineas();
   }else calcular();
  });
 });
 document.querySelectorAll('[data-quitar]').forEach(b=>b.onclick=()=>{
  if(borrador.length<2){mensaje('La venta debe conservar por lo menos un producto.','error');return;}
  borrador.splice(Number(b.dataset.quitar),1);pintarLineas();
 });
 calcular();altura();
}
function calcular(){$('totalNuevo').textContent='TOTAL CORREGIDO: '+dinero(borrador.reduce((s,d)=>s+Number(d.cantidad||0)*Number(d.precio_unitario||0),0));}
function abrirEdicion(id){
 if(perfil?.rol!=='administrador')return;
 editando=ventas.find(v=>v.id===id&&v.estado==='registrada');if(!editando)return;
 borrador=editando.detalles.map(d=>({...d,producto_id:Number(d.producto_id),cantidad:Number(d.cantidad),precio_unitario:Number(d.precio_unitario)}));
 $('editor').innerHTML='<h2>CORREGIR VENTA · '+esc(fecha(editando.fecha))+'</h2><p>Al guardar se restituyen las cantidades anteriores y se descuentan las nuevas. Se conserva un registro del cambio.</p><form id="formEditar"><div id="lineas"></div><div class="actions"><button type="button" class="btn sec" id="agregar">+ AÑADIR PRODUCTO</button></div><div class="field"><label>FORMA DE PAGO</label><select id="pago"><option value="efectivo">EFECTIVO</option><option value="qr">QR</option><option value="mixto">MIXTO</option></select></div><div id="mixto" class="mixed hidden"><div><label>EFECTIVO (Bs)</label><input id="efectivo" type="number" step="0.01" min="0.01"></div><div><label>QR (Bs)</label><input id="qr" type="number" step="0.01" min="0.01"></div></div><h2 id="totalNuevo"></h2><div class="field"><label>MOTIVO DE CORRECCIÓN</label><textarea id="motivo" minlength="3" maxlength="500" required placeholder="Detallá qué error se corrigió"></textarea></div><div class="actions"><button type="submit" class="btn" id="guardar">GUARDAR CORRECCIÓN</button><button type="button" class="btn sec" id="cancelar">CANCELAR</button></div></form>';
 mostrar('editor',true);
 $('pago').value=editando.metodo_pago;
 $('efectivo').value=editando.monto_efectivo||0;$('qr').value=editando.monto_qr||0;
 const toggle=()=>mostrar('mixto',$('pago').value==='mixto');$('pago').onchange=toggle;toggle();
 $('agregar').onclick=()=>{
  const p=productos.find(p=>!borrador.some(d=>Number(d.producto_id)===Number(p.id)));
  if(!p){mensaje('No quedan productos disponibles para añadir.','error');return;}
  borrador.push({producto_id:Number(p.id),producto:p.detalles,cantidad:1,precio_unitario:Number(p.precio_venta)});pintarLineas();
 };
 $('cancelar').onclick=()=>{mostrar('editor',false);editando=null;};
 $('formEditar').onsubmit=corregir;pintarLineas();
 $('editor').scrollIntoView({behavior:'smooth'});
}
async function corregir(ev){
 ev.preventDefault();if(perfil?.rol!=='administrador'||!editando)return;
 const items=borrador.map(d=>({producto_id:Number(d.producto_id),cantidad:Number(d.cantidad),precio_unitario:Number(d.precio_unitario)}));
 if(!items.length||items.some(d=>!Number.isSafeInteger(d.producto_id)||d.producto_id<1||!Number.isFinite(d.cantidad)||d.cantidad<=0||!Number.isFinite(d.precio_unitario)||d.precio_unitario<=0)){mensaje('Revisá cantidades, precios y productos.','error');return;}
 if(new Set(items.map(d=>d.producto_id)).size!==items.length){mensaje('No repitas el mismo producto; sumá su cantidad.','error');return;}
 const motivo=$('motivo').value.trim(),pago=$('pago').value;
 if(motivo.length<3){mensaje('Explicá el motivo de la corrección.','error');return;}
 if(!confirm('¿Guardar esta corrección? Se ajustará el inventario y quedará auditada.'))return;
 $('guardar').disabled=true;
 try{
  const {data,error}=await db.rpc('corregir_venta_historial',{p_venta_id:editando.id,p_items:items,p_metodo_pago:pago,p_monto_efectivo:pago==='mixto'?Number($('efectivo').value):null,p_monto_qr:pago==='mixto'?Number($('qr').value):null,p_motivo:motivo});
  if(error)throw error;
  await cargar(true);mensaje('VENTA CORREGIDA · '+dinero(data.total)+' · Inventario ajustado.','ok');
 }catch(e){mensaje('No se pudo corregir: '+(e.message||e),'error');}
 finally{if($('guardar'))$('guardar').disabled=false;}
}
async function anular(id){
 if(perfil?.rol!=='administrador')return;
 const v=ventas.find(x=>x.id===id&&x.estado==='registrada');if(!v)return;
 const motivo=prompt('Motivo para anular la venta de '+dinero(v.total)+':');
 if(motivo===null)return;
 if(motivo.trim().length<3){mensaje('Escribí un motivo de al menos tres caracteres.','error');return;}
 if(!confirm('¿Anular esta venta? Se devolverán sus cantidades al inventario.'))return;
 try{
  const {error}=await db.rpc('anular_venta_historial',{p_venta_id:id,p_motivo:motivo.trim()});
  if(error)throw error;
  await cargar(true);mensaje('VENTA ANULADA · Inventario restaurado y movimiento auditado.','ok');
 }catch(e){mensaje('No se pudo anular: '+(e.message||e),'error');}
}
$('buscar').onclick=()=>cargar(true);
$('limpiar').onclick=()=>{$('empleado').value='';$('desde').value='';$('hasta').value='';$('busca').value='';void cargar(true);};
$('mas').onclick=()=>cargar(false);
await iniciar();
</script></body></html>
